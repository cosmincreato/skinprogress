services:
  db:
    image: postgres:latest
    container_name: skinprogress-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secpa55
      - POSTGRES_DB=skinprogressdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
