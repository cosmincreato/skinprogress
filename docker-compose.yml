services:
  db:
    image: postgres:latest
    container_name: skinprogress-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secpa55
      - POSTGRES_DB=skinprogressdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  ai-analyzer:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: skinprogress-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - HF_HOME=/tmp/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  db_data:
