services:
  db:
    image: postgres:latest
    container_name: skinprogress-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secpa55
      - POSTGRES_DB=skinprogressdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  ai-analyzer:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: skinprogress-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - HF_HOME=/tmp/huggingface
      - MODEL_BACKEND=acne_severity
      - HEATMAP_ENABLED=1
      - HEATMAP_BACKEND=uniform_face
      - ACNE_DETECT_MODEL_REPO=Tinny-Robot/acne
      - ACNE_DETECT_MODEL_FILE=acne.pt
      - PRELOAD_MODELS=1
      - ACNE_DETECT_CONF=0.40
      - UNIFORM_FACE_ALPHA=130
    volumes:
      - hf_cache:/tmp/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  db_data:
  hf_cache:
