services:
  db:
    image: postgres:latest
    container_name: skinprogress-db
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./SkinProgress
      dockerfile: SkinProgress/Dockerfile
    container_name: skinprogress-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - AiService__BaseUrl=http://ai-analyzer:8001
      - Qdrant__Host=qdrant
      - Qdrant__Port=6333
      - Qdrant__ApiKey=${QDRANT_API_KEY:-}
      - Ollama__Host=ollama
      - Ollama__Port=11434
      - Email__Provider=${EMAIL_PROVIDER:-console}
      - Email__FromEmail=${EMAIL_FROM_ADDRESS}
      - Email__FromName=${EMAIL_FROM_NAME}
      - Email__Smtp__Host=mailpit
      - Email__Smtp__Port=1025
      - App__BaseUrl=${APP_BASE_URL:-http://localhost:3000}
    volumes:
      - ./SkinProgress/SkinProgress/wwwroot:/app/wwwroot
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_N8N_WEBHOOK_URL=${VITE_N8N_WEBHOOK_URL:-}
    container_name: skinprogress-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  ai-analyzer:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: skinprogress-ai
    restart: unless-stopped
    env_file: .env
    ports:
      - "${AI_SERVICE_PORT}:8001"
    environment:
      - HF_HOME=${HF_HOME}
      - MODEL_BACKEND=${MODEL_BACKEND}
      - HEATMAP_ENABLED=${HEATMAP_ENABLED}
      - HEATMAP_BACKEND=${HEATMAP_BACKEND}
      - ACNE_DETECT_MODEL_REPO=${ACNE_DETECT_MODEL_REPO}
      - ACNE_DETECT_MODEL_FILE=${ACNE_DETECT_MODEL_FILE}
      - PRELOAD_MODELS=${PRELOAD_MODELS}
      - ACNE_DETECT_CONF=${ACNE_DETECT_CONF}
      - ACNE_DETECT_IOU=${ACNE_DETECT_IOU}
      - ACNE_DETECT_MAX_DET=${ACNE_DETECT_MAX_DET}
      - ACNE_HEATMAP_RADIUS_RATIO=${ACNE_HEATMAP_RADIUS_RATIO}
      - UNIFORM_FACE_ALPHA=${UNIFORM_FACE_ALPHA}
      - CLIP_MODEL_ID=${CLIP_MODEL_ID}
      - ACNE_MODEL_ID=${ACNE_MODEL_ID}
    volumes:
      - hf_cache:/tmp/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: skinprogress-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: skinprogress-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_SECURE_COOKIE=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: skinprogress-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 10s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: skinprogress-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
      - MP_WEBUI=on
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: skinprogress-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    container_name: skinprogress-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "mxbai-embed-large"]
    restart: "no"

volumes:
  db_data:
  hf_cache:
  redis_data:
  n8n_data:
  qdrant_data:
  mailpit_data:
  ollama_data:
